{{ define "main" }}
<section class="container">
  <div class="section-heading">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
  <div class="product-grid">
    {{ range .Pages }}
      {{ partial "product-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}

<article class="product-card{{ if .Params.featured }} featured{{ end }}">
  {{ if .Params.featured }}<span class="featured-badge">Destaque</span>{{ end }}
  <a class="product-card-link" href="{{ .RelPermalink }}">
    <div class="product-media">
      {{ with .Params.image }}
      <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
      {{ else }}
      <span class="product-media-placeholder">{{ $.Title }}</span>
      {{ end }}
    </div>
    <div class="product-info">
      <h2 class="product-title">{{ .Title }}</h2>
      {{ with .Params.summary }}<p class="product-summary">{{ . }}</p>{{ end }}
    </div>
    <div class="product-price">
      <span class="price-value">{{ .Params.price }}</span>
      {{ with .Params.old_price }}<span class="price-old">{{ . }}</span>{{ end }}
    </div>
  </a>
</article>
